<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome · Event Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card wide">
    <div class="avatar" id="avatar">?</div>
    <h1>Welcome, <span id="name">friend</span> <span class="wave">👋</span></h1>
    <p class="sub" id="email"></p>

    <h2>Your groups</h2>
    <div class="chips" id="groups"></div>

    <h2>Your permissions</h2>
    <div class="chips" id="scopes"></div>

    <button id="logout" class="ghost" type="button">Sign out</button>
    <p id="logout-error" class="error" role="alert"></p>
  </main>

  <script src="config.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
